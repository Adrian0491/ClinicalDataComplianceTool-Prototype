# =============================================================================
# nginx — production config for Angular SPA
# Gzip, security headers, Angular HTML5 routing, health endpoint
# =============================================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Frontend and backend are separate Cloud Run services with different
    # hostnames — there is no shared origin, so /api/* has to be explicitly
    # proxied here. A `resolver` + variable upstream (rather than a bare
    # proxy_pass) keeps nginx re-resolving DNS periodically instead of
    # caching the backend's IP forever, since Cloud Run IPs aren't stable.
    resolver 8.8.8.8 valid=30s;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;   # don't expose nginx version

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/rss+xml application/atom+xml image/svg+xml
        application/x-font-ttf font/opentype;

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # ── Security headers (HIPAA / OWASP) ──────────────────────────────────
        # nginx does NOT merge add_header directives across nesting levels: a
        # location block that defines even one add_header of its own stops
        # inheriting every add_header from this server block — silently, with
        # no warning. That previously meant these headers never reached any
        # real page (/, static assets, /health all define their own
        # Cache-Control/Content-Type), only paths matching no location at
        # all. Every location below that sets its own add_header repeats
        # this full block rather than relying on inheritance.
        #
        # Also: nginx does not treat backslash-newline as a shell-style line
        # continuation inside a quoted string — a previous version of the CSP
        # directive used one, and the literal backslashes and indentation
        # whitespace ended up baked into the actual header value sent to
        # browsers. Keeping it on one line avoids that class of bug entirely.
        add_header X-Frame-Options              "DENY"                  always;
        add_header X-Content-Type-Options       "nosniff"              always;
        add_header X-XSS-Protection            "1; mode=block"         always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy          "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;

        # ── Health check for Cloud Run ─────────────────────────────────────────
        location = /health {
            access_log off;
            # `add_header Content-Type ...` appends rather than replaces, so
            # the response ended up with both the http-block default_type
            # (application/octet-stream) and this one on the same header,
            # comma-joined. `default_type` actually sets it for `return`.
            default_type application/json;
            return 200 '{"status":"ok","component":"frontend"}';
            add_header X-Frame-Options              "DENY"                  always;
            add_header X-Content-Type-Options       "nosniff"              always;
            add_header X-XSS-Protection            "1; mode=block"         always;
            add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy          "geolocation=(), camera=(), microphone=()" always;
            add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
        }

        # ── Proxy API calls to the backend Cloud Run service ────────────────────
        # Without this, /api/* falls through to the SPA location below, which
        # only knows how to serve static files — POST requests (e.g. login)
        # come back as a bare 405 from nginx, never reaching the backend.
        location /api/ {
            set $backend_upstream "integris-backend-dev-937675960249.europe-west1.run.app";
            proxy_pass https://$backend_upstream;
            proxy_ssl_server_name on;
            proxy_set_header Host $backend_upstream;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Angular static assets with long-lived cache ────────────────────────
        location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
            add_header X-Frame-Options              "DENY"                  always;
            add_header X-Content-Type-Options       "nosniff"              always;
            add_header X-XSS-Protection            "1; mode=block"         always;
            add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy          "geolocation=(), camera=(), microphone=()" always;
            add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
        }

        # ── Angular HTML5 routing — all paths → index.html ───────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Frame-Options              "DENY"                  always;
            add_header X-Content-Type-Options       "nosniff"              always;
            add_header X-XSS-Protection            "1; mode=block"         always;
            add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy          "geolocation=(), camera=(), microphone=()" always;
            add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;
        }

        # ── Block common attack paths ──────────────────────────────────────────
        location ~* \.(php|asp|aspx|jsp|cgi)$ {
            return 403;
        }

        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
